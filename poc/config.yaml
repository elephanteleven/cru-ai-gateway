# Cru AI Gateway PoC: LiteLLM config
# Free only: one small local model (Qwen3.5 0.8B, Q2_K) through Ollama.

model_list:
  # Name apps should use. Later this can point to paid models with fallback to local.
  - model_name: cru-chat
    litellm_params:
      model: ollama_chat/hf.co/bartowski/Qwen_Qwen3.5-0.8B-GGUF:Q2_K
      api_base: http://cru-ollama:11434
      # DEMO price, not a real cost. Lets us test cost tracking and budgets with a free model.
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

  # Direct name for the local model.
  - model_name: cru-local
    litellm_params:
      model: ollama_chat/hf.co/bartowski/Qwen_Qwen3.5-0.8B-GGUF:Q2_K
      api_base: http://cru-ollama:11434
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

  # Paid or free-tier providers: OFF for the PoC.
  # To try one: uncomment, put the key in .env (Cru staff do this), restart with ./up.sh
  # - model_name: cru-gemini
  #   litellm_params:
  #     model: gemini/<model-id-from-google-ai-studio>
  #     api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
  # Only metadata and cost are kept, not prompt or response text.
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
