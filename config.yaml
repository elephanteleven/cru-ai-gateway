# Cru AI Gateway demo: LiteLLM config
# Every model goes through OpenRouter (one key: OPENROUTER_API_KEY). No local models.
# The name to call is the OpenRouter model id, e.g. "anthropic/claude-fable-5.2".
# Model ids and prices were read from https://openrouter.ai/api/v1/models on 2026-11-20.
# Prices are set here because LiteLLM v1.108.8 does not know most of these models (cost would show $0).

x-or: &or
  api_key: os.environ/OPENROUTER_API_KEY

model_list:
  # Frontier (closed weights), best first. Rank: Artificial Analysis Intelligence Index v5.0.1.
  - model_name: anthropic/claude-fable-5.2    # AA 65
    litellm_params: { <<: *or, model: openrouter/anthropic/claude-fable-5.2, input_cost_per_token: 8e-06, output_cost_per_token: 4e-05 }
  - model_name: openai/gpt-6.2-astra    # AA 62
    litellm_params: { <<: *or, model: openrouter/openai/gpt-6.2-astra, input_cost_per_token: 8e-06, output_cost_per_token: 4e-05 }
  - model_name: google/gemini-4-neon    # AA 61
    litellm_params: { <<: *or, model: openrouter/google/gemini-4-neon, input_cost_per_token: 3e-06, output_cost_per_token: 1.5e-05 }
  - model_name: google/gemini-4-carbon    # AA 60
    litellm_params: { <<: *or, model: openrouter/google/gemini-4-carbon, input_cost_per_token: 2e-06, output_cost_per_token: 1e-05 }
  - model_name: anthropic/claude-opus-5.5    # AA 59
    litellm_params: { <<: *or, model: openrouter/anthropic/claude-opus-5.5, input_cost_per_token: 4e-06, output_cost_per_token: 2e-05 }
  - model_name: openai/gpt-6.2-sol    # AA 57
    litellm_params: { <<: *or, model: openrouter/openai/gpt-6.2-sol, input_cost_per_token: 2e-06, output_cost_per_token: 1e-05 }
  - model_name: anthropic/claude-sonnet-5.5    # AA 55
    litellm_params: { <<: *or, model: openrouter/anthropic/claude-sonnet-5.5, input_cost_per_token: 2e-06, output_cost_per_token: 1e-05 }
  - model_name: google/gemini-4-hydrogen    # AA 54
    litellm_params: { <<: *or, model: openrouter/google/gemini-4-hydrogen, input_cost_per_token: 1.5e-06, output_cost_per_token: 7.5e-06 }
  - model_name: openai/gpt-6.1-terra    # AA 51
    litellm_params: { <<: *or, model: openrouter/openai/gpt-6.1-terra, input_cost_per_token: 1e-06, output_cost_per_token: 5e-06 }
  - model_name: google/gemini-4-argon    # AA 50
    litellm_params: { <<: *or, model: openrouter/google/gemini-4-argon, input_cost_per_token: 2e-06, output_cost_per_token: 1e-05 }

  # Open weights, best first. Rank: BenchLM open-source board (2026-11-19).
  - model_name: moonshotai/kimi-k3.1-pro    # #1, 70.6
    litellm_params: { <<: *or, model: openrouter/moonshotai/kimi-k3.1-pro, input_cost_per_token: 2.53e-07, output_cost_per_token: 8.8e-06 }
  - model_name: deepseek/deepseek-v4.1-flash-1017    # #2, 69.9
    litellm_params: { <<: *or, model: openrouter/deepseek/deepseek-v4.1-flash-1017, input_cost_per_token: 1.5e-07, output_cost_per_token: 6e-07 }
  - model_name: tencent/hy4-preview    # #3, 68.2
    litellm_params: { <<: *or, model: openrouter/tencent/hy4-preview, input_cost_per_token: 8.34e-07, output_cost_per_token: 2.501e-06 }
  - model_name: inclusionai/ling-3.1-flash    # #4, 66.8 estimated
    litellm_params: { <<: *or, model: openrouter/inclusionai/ling-3.1-flash, input_cost_per_token: 4.5e-08, output_cost_per_token: 1.35e-07 }
  - model_name: moonshotai/kimi-k3    # #6, 65.5
    litellm_params: { <<: *or, model: openrouter/moonshotai/kimi-k3, input_cost_per_token: 1.92e-07, output_cost_per_token: 1.6e-05 }
  - model_name: z-ai/glm-5.3    # #7, 63.8
    litellm_params: { <<: *or, model: openrouter/z-ai/glm-5.3, input_cost_per_token: 6.99e-08, output_cost_per_token: 1.4e-06 }
  - model_name: xiaomi/mimo-v2.6-pro    # #8, 63.5
    litellm_params: { <<: *or, model: openrouter/xiaomi/mimo-v2.6-pro, input_cost_per_token: 4.35e-07, output_cost_per_token: 8.7e-07 }
  - model_name: xiaomi/mimo-v2.6-flash    # #9, 63.2
    litellm_params: { <<: *or, model: openrouter/xiaomi/mimo-v2.6-flash, input_cost_per_token: 1.4e-07, output_cost_per_token: 2.8e-07 }
  - model_name: stepfun/step-5-preview    # #11, 62.8
    litellm_params: { <<: *or, model: openrouter/stepfun/step-5-preview, input_cost_per_token: 1e-06, output_cost_per_token: 2.7e-06 }
  - model_name: deepseek/deepseek-v4-pro    # #12, 61.5
    litellm_params: { <<: *or, model: openrouter/deepseek/deepseek-v4-pro, input_cost_per_token: 9e-07, output_cost_per_token: 1.5e-06 }

  # Small open weights that fit one GPU with 96 GB or less (80B params or less), best first. Rank: BenchLM.
  # Dropped after the 2026-11-20 test: prism-ml/ternary-bonsai-2-27b (blocked by account ZDR), liquid/lfm-2.5-24b-a2b (provider 504).
  - model_name: qwen/qwen3.8-27b    # 27B, #20
    litellm_params: { <<: *or, model: openrouter/qwen/qwen3.8-27b, input_cost_per_token: 6e-08, output_cost_per_token: 2.2e-06 }
  - model_name: meta/muse-glimmer-30b    # 30B, #40
    litellm_params: { <<: *or, model: openrouter/meta/muse-glimmer-30b, input_cost_per_token: 3.5e-07, output_cost_per_token: 1.5e-06 }
  - model_name: qwen/qwen3.6-27b    # 27B, #41
    litellm_params: { <<: *or, model: openrouter/qwen/qwen3.6-27b, input_cost_per_token: 3.2e-07, output_cost_per_token: 3.2e-06 }
  - model_name: google/gemma-4-31b-it    # 31B, #48
    litellm_params: { <<: *or, model: openrouter/google/gemma-4-31b-it, input_cost_per_token: 2e-07, output_cost_per_token: 4e-07 }
  - model_name: microsoft/phi-4    # 14B, #52
    litellm_params: { <<: *or, model: openrouter/microsoft/phi-4, input_cost_per_token: 7e-08, output_cost_per_token: 1.4e-07 }
  - model_name: qwen/qwen3.5-27b    # 27B, #53
    litellm_params: { <<: *or, model: openrouter/qwen/qwen3.5-27b, input_cost_per_token: 2.6e-07, output_cost_per_token: 2.6e-06 }
  - model_name: qwen/qwen3.6-35b-a3b    # 35B A3B, #55
    litellm_params: { <<: *or, model: openrouter/qwen/qwen3.6-35b-a3b, input_cost_per_token: 1e-07, output_cost_per_token: 9e-07 }
  - model_name: google/gemma-4-26b-a4b-it    # 26B A4B, #62
    litellm_params: { <<: *or, model: openrouter/google/gemma-4-26b-a4b-it, input_cost_per_token: 7.65e-08, output_cost_per_token: 2.55e-07 }
  - model_name: z-ai/glm-4.7-flash    # 30B A3B, #64
    litellm_params: { <<: *or, model: openrouter/z-ai/glm-4.7-flash, input_cost_per_token: 6.05e-08, output_cost_per_token: 4e-07 }
  - model_name: qwen/qwen3.5-35b-a3b    # 35B A3B, #71
    litellm_params: { <<: *or, model: openrouter/qwen/qwen3.5-35b-a3b, input_cost_per_token: 1.4e-07, output_cost_per_token: 1e-06 }

  # Routers (like Jev): they pick another model for each request. No benchmark ranks routers; order is our judgment.
  # Price changes per request, so no fixed price is set here.
  - model_name: openrouter/fusion    # several models answer, then one merged answer
    litellm_params: { <<: *or, model: openrouter/openrouter/fusion }
  - model_name: openrouter/auto    # OpenRouter's main router
    litellm_params: { <<: *or, model: openrouter/openrouter/auto }
  - model_name: typesafe/jev-router    # Jev Router
    litellm_params: { <<: *or, model: openrouter/typesafe/jev-router }
  - model_name: nvidia/switchyard    # open source router, lowest cost
    litellm_params: { <<: *or, model: openrouter/nvidia/switchyard }
  - model_name: openrouter/pareto-code    # coding, by Artificial Analysis coding score
    litellm_params: { <<: *or, model: openrouter/openrouter/pareto-code }
  - model_name: openrouter/auto-code    # coding agents
    litellm_params: { <<: *or, model: openrouter/openrouter/auto-code }
  - model_name: openrouter/auto-beta    # test version of auto
    litellm_params: { <<: *or, model: openrouter/openrouter/auto-beta }
  - model_name: openrouter/free    # picks a free model at random
    litellm_params: { <<: *or, model: openrouter/openrouter/free }

litellm_settings:
  drop_params: true
  request_timeout: 120
  # false = keep prompt and response text (needed for store_prompts_in_spend_logs below).
  # Set to true to keep only metadata and cost.
  turn_off_message_logging: false
  # Prometheus metrics at /metrics. Free in v1.108.8 (checked in the PoC, no license needed).
  callbacks: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Save full prompt and response text of every request (Admin UI > Logs).
  # Every admin, including proxy_admin_viewer, can read it. Demo only: no real Cru data.
  store_prompts_in_spend_logs: true
  # Delete request logs older than this, so the DB does not grow forever.
  maximum_spend_logs_retention_period: "30d"
  # Turn off the shared UI_USERNAME/UI_PASSWORD login so every admin uses a named account.
  # ONLY set this to true after at least one named proxy_admin can log in
  # (Admin UI > Internal Users > invite, open the link, set a password), or nobody can log in to the UI.
  # The master key still works on the API if you get locked out; set back to false and redeploy.
  disable_env_credential_login: false   # set to true after your own admin account works
