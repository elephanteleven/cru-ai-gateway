# Cru AI Gateway: Docker Compose stack (works in Coolify and with plain `docker compose`).
#
# Services:
#   postgres    keys, users, teams, spend logs
#   llama       llama.cpp router with several small local models (OpenAI-compatible, internal only).
#               Downloads the GGUF files into a volume on first start and checks their sha256.
#   litellm     the gateway (the only service that gets a public domain)
#
# Coolify: see docs/coolify.md. Values named SERVICE_PASSWORD_* are generated by Coolify.
# Local:   cp .env.example .env, fill it in, then: docker compose up -d
#
# Pinned versions: tag for humans, digest so the image cannot change. Never use "latest".

services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  # llama.cpp server in router mode: several small local models (all <= 1B params, Q2_K) behind one API.
  # On start it downloads any missing model into the volume (pinned to a Hugging Face commit,
  # checked by sha256), writes /models/presets.ini, then starts the router.
  # A model loads on its first request; at most --models-max stay in memory (least recently used is unloaded).
  # To add a model: add a line to MODELS (id repo commit file sha256, sha from the HF API), and a matching
  # entry in config.yaml.
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-b12063@sha256:10a38e6cc91760ab157f0a0a8546218d35f4a314432a70298abfa3d096829ad7
    restart: unless-stopped
    environment:
      LLAMA_API_KEY: ${SERVICE_PASSWORD_LLAMA:?}
      # id | Hugging Face repo | commit | file | sha256          (params, license)
      MODELS: |
        qwen3.5-0.8b bartowski/Qwen_Qwen3.5-0.8B-GGUF f36b1ea49a332ede8fe5f389bbf5b3575ef71f48 Qwen_Qwen3.5-0.8B-Q2_K.gguf 0117c1dca3a5462364e0cabd44c57a1d7a15876023eb2d1f2ae356df37a918e1
        qwen3-0.6b unsloth/Qwen3-0.6B-GGUF 50968a4468ef4233ed78cd7c3de230dd1d61a56b Qwen3-0.6B-Q2_K.gguf 26d035ea15c4a2853e8d20ffc56a76f6164e17dbb6c9e532c5766700c404519d
        qwen2.5-0.5b bartowski/Qwen2.5-0.5B-Instruct-GGUF 41ba88dbac95fed2528c92514c131d73eb5a174b Qwen2.5-0.5B-Instruct-Q2_K.gguf c929ba8be98f584d0872923e373bda0da8a261eae05dd362590c9792adfc76d2
        gemma3-1b bartowski/google_gemma-3-1b-it-GGUF 116f76234503685a98f572982177b11d44ec8ff1 google_gemma-3-1b-it-Q2_K.gguf 573199687e6a940d308e8bf0a1f4855e5987136a39b7cabca4427db74b769f47
        gemma3-270m unsloth/gemma-3-270m-it-GGUF c90975dbd40c0c7b275fefaae758c3415c906238 gemma-3-270m-it-Q2_K.gguf 068e49b136fc2acc5f90e29452be854ab68cc6b0bc76c725eb5858cf27bc1984
        smollm2-360m bartowski/SmolLM2-360M-Instruct-GGUF 7be6f65f1db715fe5dc5a4634c0d459b4eed42ec SmolLM2-360M-Instruct-Q2_K.gguf 72a422519a359d679c987246d42c65009a3d4dbf9546fdea4120e758b427af02
    entrypoint: ["/bin/sh", "-c"]
    # reasoning = off: Qwen3 / Qwen3.5 would otherwise "think" first and use up max_tokens.
    command:
      - |
        set -e
        p=/models/presets.ini
        printf 'version = 1\n\n[*]\nc = 4096\nnp = 1\nreasoning = off\n' > "$$p.tmp"
        echo "$$MODELS" | while read -r id repo rev file sha; do
          [ -n "$$id" ] || continue
          f="/models/$$file"
          if ! { [ -f "$$f" ] && echo "$$sha  $$f" | sha256sum -c - >/dev/null 2>&1; }; then
            echo "downloading $$id ($$file)"
            curl -fsSL -o "$$f.part" "https://huggingface.co/$$repo/resolve/$$rev/$$file"
            echo "$$sha  $$f.part" | sha256sum -c - >/dev/null || { echo "sha256 mismatch for $$file"; exit 1; }
            mv "$$f.part" "$$f"
          fi
          echo "model ok: $$id"
          printf '\n[%s]\nmodel = %s\n' "$$id" "$$f" >> "$$p.tmp"
        done
        mv "$$p.tmp" "$$p"
        exec /app/llama-server --models-preset "$$p" --models-max 2 --host 0.0.0.0 --port 8080
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s # first start downloads about 2.2 GB of models

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.108.8@sha256:277bb7109e59cedf9ddd48a367ecc72a9ddcc86060c4a50fa1fd78fe4c67f28d # LTS, cosign verified
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      llama:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Coolify: gives this service a domain, routed to container port 4000.
      SERVICE_URL_LITELLM_4000: /
      # Must start with "sk-". Set it yourself in Coolify (see docs/coolify.md). Required.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      # Encrypts secrets stored in the DB. Never change it after first start.
      LITELLM_SALT_KEY: ${SERVICE_PASSWORD_64_SALTKEY:?}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${SERVICE_PASSWORD_UI:?}
      LLAMA_API_KEY: ${SERVICE_PASSWORD_LLAMA:?}
      DATABASE_URL: postgresql://litellm:${SERVICE_PASSWORD_POSTGRES:?}@postgres:5432/litellm
      # Public URL, used in invite links and UI redirects.
      PROXY_BASE_URL: ${SERVICE_URL_LITELLM_4000:?}
      # Cloud provider keys (free tiers for the demo). Optional: empty means that model just fails
      # and cru-cloud falls back. Cru staff put the real values in Coolify / .env, never in git.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  pgdata:
  models:
