# Cru AI Gateway: Docker Compose stack (works in Coolify and with plain `docker compose`).
#
# Services:
#   postgres    keys, users, teams, spend logs
#   litellm     the gateway (the only service that gets a public domain)
#
# No local models: every model goes through OpenRouter (see config.yaml).
#
# Coolify: see docs/coolify.md. Values named SERVICE_PASSWORD_* are generated by Coolify.
# Local:   cp .env.example .env, fill it in, then: docker compose up -d
#
# Pinned versions: tag for humans, digest so the image cannot change. Never use "latest".

services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.108.8@sha256:277bb7109e59cedf9ddd48a367ecc72a9ddcc86060c4a50fa1fd78fe4c67f28d # LTS, cosign verified
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Coolify: gives this service a domain, routed to container port 4000.
      SERVICE_URL_LITELLM_4000: /
      # Must start with "sk-". Set it yourself in Coolify (see docs/coolify.md). Required.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      # Encrypts secrets stored in the DB. Never change it after first start.
      LITELLM_SALT_KEY: ${SERVICE_PASSWORD_64_SALTKEY:?}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${SERVICE_PASSWORD_UI:?}
      DATABASE_URL: postgresql://litellm:${SERVICE_PASSWORD_POSTGRES:?}@postgres:5432/litellm
      # Public URL, used in invite links and UI redirects.
      PROXY_BASE_URL: ${SERVICE_URL_LITELLM_4000:?}
      # OpenRouter key for every model. Cru staff put the real value in Coolify / .env, never in git.
      # Empty: the gateway starts, but every model call fails.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  pgdata:
